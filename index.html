<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8FAFC" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Satzklar</title>
    <meta
      name="description"
      content="Stundensatz ausrechnen, Angebot und Rechnung schreiben, offene Beträge im Blick behalten."
    />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("satzklar.v1") || "null")
        var theme = saved && saved.theme
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0B1220" : "#F8FAFC")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
